name: aegis-production
x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '5'}
x-api-environment: &api-environment
  AEGIS_MODE: production
  AEGIS_SIGNING_SECRET: ${AEGIS_SIGNING_SECRET:?Provision session key}
  AEGIS_DATABASE_URL: ${AEGIS_DATABASE_URL:?Provision application database URL}
  AEGIS_ALLOWED_ORIGINS: ${AEGIS_ALLOWED_ORIGINS:?Set HTTPS origins}
  AEGIS_TOKEN_MINUTES: ${AEGIS_TOKEN_MINUTES:-15}
  AEGIS_REDIS_URL: ${AEGIS_REDIS_URL:?Provision Redis URL}
  AEGIS_FABRIC_URL: ${AEGIS_FABRIC_URL:?Set bridge HTTPS URL}
  AEGIS_FABRIC_TOKEN: ${AEGIS_FABRIC_TOKEN:?Provision bridge token}
  AEGIS_FABRIC_CA_BUNDLE: /run/tls/ca.crt
  AEGIS_S3_ENDPOINT: ${AEGIS_S3_ENDPOINT:?Set HTTPS object endpoint}
  AEGIS_S3_REGION: ${AEGIS_S3_REGION:-us-east-1}
  AEGIS_S3_BUCKET: ${AEGIS_S3_BUCKET:-aegis-evidence}
  AEGIS_S3_ACCESS_KEY: ${AEGIS_S3_ACCESS_KEY:?Provision object app key}
  AEGIS_S3_SECRET_KEY: ${AEGIS_S3_SECRET_KEY:?Provision object app secret}
  AEGIS_S3_KMS_KEY: ${AEGIS_S3_KMS_KEY:?Provision KMS key ID}
  AEGIS_CREDENTIAL_PRIVATE_KEY: /run/keys/vc-private.pem
  AEGIS_CREDENTIAL_KEY_ID: ${AEGIS_CREDENTIAL_KEY_ID:?Set signing key ID}
  AEGIS_CREDENTIAL_PUBLIC_KEYS: ${AEGIS_CREDENTIAL_PUBLIC_KEYS:?Set verifier key map}
  AEGIS_PROFILE_ENCRYPTION_KEY: ${AEGIS_PROFILE_ENCRYPTION_KEY:?Provision profile key}
  AEGIS_MALWARE_HOST: ${AEGIS_MALWARE_HOST:-malware}
  AEGIS_MALWARE_PORT: ${AEGIS_MALWARE_PORT:-3310}
services:
  malware:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    networks: [application]
    volumes: [malware-signatures:/var/lib/clamav]
    mem_limit: 3g
    # Official entrypoint loads signatures and drops daemon privileges. No host mounts or privileged mode.
    security_opt: [no-new-privileges:true]
  volume-init:
    image: postgres:16-alpine
    profiles: [tools]
    user: '0:0'
    entrypoint: [/bin/sh, -c]
    command: ['chown 10001:10001 /objects && chown 1000:1000 /wallet']
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes: [objects:/objects, wallet:/wallet]
  api:
    <<: *hardening
    build: ./backend
    environment: *api-environment
    read_only: true
    tmpfs: [/tmp]
    volumes: [./infra/secrets/tls:/run/tls:ro, ./infra/secrets/keys:/run/keys:ro]
    networks: [application]
    mem_limit: 768m
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 60s
  worker:
    <<: *hardening
    build: ./backend
    command: [python, -m, app.worker]
    environment: *api-environment
    read_only: true
    tmpfs: [/tmp]
    volumes: [./infra/secrets/tls:/run/tls:ro, ./infra/secrets/keys:/run/keys:ro]
    networks: [application]
    mem_limit: 768m
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
  migrate:
    <<: *hardening
    restart: 'no'
    build: ./backend
    profiles: [tools]
    command: [python, -m, app.migrate]
    environment:
      <<: *api-environment
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis_owner:${POSTGRES_PASSWORD:?Provision owner secret}@postgres:5432/aegis?sslmode=verify-full&sslrootcert=/run/tls/ca.crt
    volumes: [./infra/secrets/tls:/run/tls:ro]
    networks: [application]
  ui:
    <<: *hardening
    build: ./frontend
    ports: ['443:8443']
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes: [./infra/nginx-production.conf:/etc/nginx/conf.d/default.conf:ro, ./infra/secrets/tls:/run/tls:ro]
    networks: [application]
    mem_limit: 256m
    cpus: 0.5
  bridge:
    <<: *hardening
    build: ./fabric-service
    environment:
      WALLET_KEY: ${WALLET_KEY:?Provision wallet encryption key}
      BRIDGE_TOKEN: ${AEGIS_FABRIC_TOKEN:?Provision bridge token}
      BRIDGE_TLS_KEY: /run/tls/bridge.key
      BRIDGE_TLS_CERT: /run/tls/bridge.crt
      WALLET_DIR: /wallet
      FABRIC_ORGANIZATIONS_FILE: /run/fabric/organizations.json
      FABRIC_EVENT_IDENTITY: ${FABRIC_EVENT_IDENTITY:?Provision event identity}
    read_only: true
    tmpfs: [/tmp]
    volumes: [wallet:/wallet, ./infra/secrets/tls:/run/tls:ro, ./infra/secrets/fabric:/run/fabric:ro]
    networks: [application, fabric]
    mem_limit: 512m
    cpus: 1
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provision database owner secret}
      AEGIS_DB_PASSWORD: ${AEGIS_DB_PASSWORD:?Provision application database secret}
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/tls/postgres.crt, -c, ssl_key_file=/run/tls/postgres.key]
    # PostgreSQL entrypoint initializes data and changes ownership before dropping to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes: [postgres:/var/lib/postgresql/data, ./infra/secrets/tls:/run/tls:ro, ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro]
    networks: [application]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aegis_owner -d aegis']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    <<: *hardening
    image: redis:7-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Provision Redis secret}
    entrypoint: [/bin/sh, /run/start-redis.sh]
    volumes: [./infra/redis-start.sh:/run/start-redis.sh:ro, ./infra/secrets/tls:/run/tls:ro]
    tmpfs: [/tmp]
    networks: [application]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /run/tls/ca.crt --sni redis -h redis ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
  objects:
    <<: *hardening
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    user: '10001:10001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Provision storage administrator}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Provision storage admin secret}
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:?Configure KES}
      MINIO_KMS_KES_KEY_FILE: /run/keys/kes-client.key
      MINIO_KMS_KES_CERT_FILE: /run/keys/kes-client.crt
      MINIO_KMS_KES_CAPATH: /run/tls/ca.crt
      MINIO_KMS_KES_KEY_NAME: ${MINIO_KMS_KES_KEY_NAME:?Provision KMS key}
    command: [server, /data, --certs-dir, /run/minio-tls]
    volumes: [objects:/data, ./infra/secrets/minio-tls:/run/minio-tls:ro, ./infra/secrets/tls:/run/tls:ro, ./infra/secrets/keys:/run/keys:ro]
    networks: [application]
    mem_limit: 1g
volumes:
  malware-signatures:
  postgres:
  objects:
  wallet:
networks:
  application:
  fabric:
    external: true
    name: ${FABRIC_DOCKER_NETWORK:?Provision Fabric network}
