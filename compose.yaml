name: aegis
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      AEGIS_DATABASE_URL: sqlite:////data/aegis-demo.db
    volumes: [demo-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 3s
      retries: 3
  ui:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:16-alpine
    profiles: [integration]
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7-alpine
    profiles: [integration]
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
  objects:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [integration]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run setup first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run setup first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [object-data:/data]
volumes:
  demo-data:
  postgres-data:
  object-data:
