server {
 listen 8443 ssl;
 ssl_certificate /run/tls/ui.crt;
 ssl_certificate_key /run/tls/ui.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://api:8000; proxy_buffering off; proxy_read_timeout 150s; }
 location /health/ { proxy_pass http://api:8000; }
 location / { try_files $uri $uri/ /index.html; }
}
